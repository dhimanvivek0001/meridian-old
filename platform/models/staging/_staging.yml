version: 2

models:
  - name: stg_transactions
    description: One row per item sold, Sep 2018 to Sep 2020
    columns:
      - name: sale_line_id
        data_tests: [unique, not_null]
      - name: sale_date
        data_tests: [not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: article_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_articles')
                field: article_id
      - name: price_index
        data_tests: [not_null]
      - name: sales_channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['store', 'online']

  - name: stg_customers
    description: One row per registered customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: club_member_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'PRE-CREATE', 'LEFT CLUB', 'UNKNOWN']
      - name: fashion_news_frequency
        data_tests:
          - accepted_values:
              arguments:
                values: ['REGULARLY', 'MONTHLY', 'NONE']

  - name: stg_articles
    description: One row per product variant (article)
    columns:
      - name: article_id
        data_tests: [unique, not_null]
      - name: product_code
        data_tests: [not_null]
